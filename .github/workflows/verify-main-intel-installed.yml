name: Verify exact release Mac installers
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  installed:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: x64
          - os: macos-latest
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: macos-release
          path: release
          run-id: 44368392873
          github-token: ${{ github.token }}
      - name: Record exact installer identity
        run: shasum -a 256 release/*.dmg
      - run: npm install --prefix "$RUNNER_TEMP/smoke-tools" --no-audit --no-fund playwright-core@1.56.1
      - name: Install, onboard and relaunch exact release bytes
        env:
          DANI_VERIFY_ARCH: ${{ matrix.arch }}
          DANI_EVIDENCE_DIR: evidence
        run: node scripts/verify-main-intel-installed.cjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: installed-mac-${{ matrix.arch }}-evidence
          path: evidence
          if-no-files-found: warn
          retention-days: 7
