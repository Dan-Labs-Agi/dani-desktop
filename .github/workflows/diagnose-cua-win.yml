name: Diagnose Windows CUA binary
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - shell: pwsh
        run: |
          Invoke-WebRequest 'https://github.com/trycua/cua/releases/download/cua-driver-rs-v0.28.2/cua-driver-rs-0.28.2-windows-x86_64-binary.zip' -OutFile "$env:RUNNER_TEMP/cua.zip"
          Get-FileHash "$env:RUNNER_TEMP/cua.zip" -Algorithm SHA256
          Expand-Archive "$env:RUNNER_TEMP/cua.zip" "$env:RUNNER_TEMP/cua"
          Get-ChildItem "$env:RUNNER_TEMP/cua"
          & "$env:RUNNER_TEMP/cua/cua-driver.exe" --version
          Write-Output "PowerShell exit: $LASTEXITCODE"
          $env:CUA_DIAG = "$env:RUNNER_TEMP/cua/cua-driver.exe"
          node -e 'const {execFile}=require("node:child_process");execFile(process.env.CUA_DIAG,["--version"],{timeout:30000,windowsHide:true},(error,stdout,stderr)=>console.log(JSON.stringify({error:error?{message:error.message,code:error.code,signal:error.signal,killed:error.killed}:null,stdout,stderr})))'
