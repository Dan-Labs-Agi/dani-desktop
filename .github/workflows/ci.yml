          done
          { echo "== old (published) app =="; codesign -dv --verbose=4 "old-app/Dani Bot.app" 2>&1 || true
            echo; echo "== new (branch) app =="; codesign -dv --verbose=4 "new-app/Dani Bot.app" 2>&1 || true; } > results/codesign-compare.txt
          { pgrep -fl SecurityAgent || echo "no SecurityAgent process"
            sample SecurityAgent 2 2>&1 | head -80 || true; } > results/security-agent.txt
          screencapture -x results/screen.png 2>/dev/null || echo "screencapture unavailable on this runner" >> results/security-agent.txt
          { security find-generic-password -s "Dani Bot Safe Storage" 2>&1 || true; } > results/keychain-item-metadata.txt
      - name: Redact token-shaped strings from logs before upload
        if: always()
        shell: bash
        run: |
          find results -type f -name '*.log' | while IFS= read -r f; do
            perl -pi -e 's/omb_sess_[A-Za-z0-9_-]+/[redacted]/g; s/(Bearer|api[_-]?key|token)[=: ]+[A-Za-z0-9._~-]{8,}/$1=[redacted]/gi' "$f" || true
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: install-probe-upgrade-mac-intel
          path: results/
          if-no-files-found: warn

  gate:
    name: CI
    # always(): a cancelled or failed lane must fail this gate, never skip
    # it into a green-looking check. Probe-only dispatches are gated by their
    # own probe jobs instead, matching tests-complete.
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || !inputs.install_probe) && (github.event_name != 'workflow_dispatch' || !inputs.upgrade_only) }}
    needs: [detect-optional-jobs, sdd, test, tests-complete, control-plane, package-linux, ios, android]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail closed on every required lane
        env:
          NEEDS: ${{ toJSON(needs) }}
          SHA: ${{ github.sha }}
        run: |
          node --input-type=module -e 'const needs = JSON.parse(process.env.NEEDS);
          const fail = (m) => { console.error("gate: " + m); process.exit(1); };
          const det = needs["detect-optional-jobs"];
          if (!det || det.result !== "success") fail("detect-optional-jobs " + (det ? det.result : "missing"));
          const flags = det.outputs ?? {};
          for (const j of ["sdd", "ios", "android"]) {
            if (flags[j] !== "true" && flags[j] !== "false") fail("detect-optional-jobs output " + j + " missing or malformed: " + JSON.stringify(flags[j]));
          }
          for (const j of ["test", "tests-complete", "control-plane", "package-linux"]) {
            const r = needs[j] && needs[j].result;
            if (r !== "success") fail(j + " " + (r ?? "missing"));
          }
          for (const j of ["sdd", "ios", "android"]) {
            const r = needs[j] && needs[j].result;
            if (flags[j] === "true" && r !== "success") fail(j + " selected but " + (r ?? "missing"));
            if (flags[j] === "false" && r !== "skipped") fail(j + " unselected but " + (r ?? "missing"));
          }
          console.log("gate: every required lane green at " + process.env.SHA);'
