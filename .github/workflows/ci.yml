name: CI

on:
  workflow_dispatch:
    inputs:
      upgrade_only:
        description: "Run only the two upgrade-over-data probe jobs"
        required: false
        type: boolean
        default: false
      install_probe:
        description: "Run only the packaged install/startup timing probe jobs"
        required: false
        type: boolean
        default: false
  push:
    branches: [main, prod]
  pull_request:

# least privilege: CI only reads the checkout, it never writes back
permissions:
  contents: read
  # install-probe jobs download this repo's own workflow-run artifacts
  actions: read

concurrency:
  # PR runs group per PR number so ci-stop-closed.yml cancels exactly that
  # PR's runs; other events group per event+ref so a dispatch never
  # supersedes a pending push run, and same-ref pushes still serialize.
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sdd:
    name: spec traceability and negative fixtures
    # The SDD kit documents are not part of the current tree; run only when they return.
    needs: detect-optional-jobs
    if: (github.event_name != 'workflow_dispatch' || !inputs.install_probe) && (github.event_name != 'workflow_dispatch' || !inputs.upgrade_only) && (needs.detect-optional-jobs.outputs.sdd == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 docs/dani-sdd-kit/scripts/check_kit.py --self-test
      - run: python3 docs/dani-sdd-kit/scripts/check_kit.py

  test:
    name: typecheck + test (${{ matrix.os }}, shard ${{ matrix.shard }}/${{ matrix.shards }})
    if: (github.event_name != 'workflow_dispatch' || !inputs.install_probe) && (github.event_name != 'workflow_dispatch' || !inputs.upgrade_only)
    strategy:
      fail-fast: false
      matrix:
        # The harness and pure desktop capabilities stay portable across all
        # supported host platforms. POSIX-only process tests self-skip.
        os: [macos-latest, ubuntu-latest, windows-latest]
        # Recorded CI seconds (scripts/testing/vitest-shard-weights.json) put
        # one leg's vitest at 82-114 min per OS, over the 60-minute job
        # ceiling; four shards land each leg near 45 minutes with overhead.
        shard: [1, 2, 3, 4]
        shards: [4]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate locale catalogs
        if: matrix.os == 'ubuntu-latest'
        run: pnpm i18n:check
      - name: Prepare Electron test runtime
        # Electron 43 lazily downloads its runtime on first import. Resolve it
        # before Vitest starts so a cold download cannot consume the fixture
        # timeout.
        run: node --input-type=commonjs -e "require('electron')"
      - name: Run pnpm typecheck
        # The default V8 heap (~4 GB) is not enough for this monorepo's
        # typecheck on the standard runners; give it more of the runner's RAM.
        env:
          NODE_OPTIONS: --max-old-space-size=7168
        run: pnpm typecheck
      - name: Run tests
        # vitest runs this OS's full set split four ways by recorded CI
        # seconds (DurationSequencer); every file runs exactly once across
        # the OS's four shards, and the broker, Electron and packaged-server
        # checks are unchanged in each shard. No subset filtering, same env.
        run: pnpm exec vitest run --shard=${{ matrix.shard }}/${{ matrix.shards }} && pnpm broker:test && pnpm test:electron && pnpm test:packaged-server
        env:
          # Electron 43 currently exits with EXCEPTION_BREAKPOINT before ready
          # on GitHub's Windows runners even after Chromium's required sandbox
          # ACL is present. Production fails closed there through the tested
          # browser-platform gate; keep probing the upstream regression below.
          OMB_SKIP_REAL_ELECTRON_BROWSER_FIXTURE: ${{ matrix.os == 'windows-latest' && '1' || '0' }}
          OMB_VITEST_RETRY_LOG: ${{ runner.temp }}/vitest-retries.jsonl
      - name: Report retried flakes
        if: ${{ !cancelled() }}
        run: node scripts/testing/ci-retry-summary.mjs
        env:
          OMB_VITEST_RETRY_LOG: ${{ runner.temp }}/vitest-retries.jsonl
      - name: Probe upstream Electron Windows sandbox regression
        if: matrix.os == 'windows-latest'
        continue-on-error: true
        env:
          # Keep the canary honest: no --no-sandbox or sandbox-disabling flags.
          # When electron/electron#51761 is resolved, make this blocking first,
          # then remove the production Windows gate in browser-platform.cjs.
          OMB_SKIP_REAL_ELECTRON_BROWSER_FIXTURE: "0"
        run: pnpm exec vitest run electron/browser-closed-shadow.electron.test.mjs
      - run: pnpm check:electron
      - name: production UI build
        if: matrix.os == 'ubuntu-latest'
        run: pnpm build

  tests-complete:
    name: CI tests complete
    needs: test
    # always(): without it GitHub skips this job when a shard leg fails,
    # which would hide the failure behind a skipped check instead of
    # failing one named result. The dispatch conditions stay, so probe-only
    # runs still skip it.
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || !inputs.install_probe) && (github.event_name != 'workflow_dispatch' || !inputs.upgrade_only) }}
    runs-on: ubuntu-latest
    steps:
      # Aggregation only: propagates any shard's failure or cancellation to
      # one named result. needs.test.result is failure when any matrix leg
      # failed, so every test on every OS still decides this check.
      - run: test "${{ needs.test.result }}" = "success"

  control-plane:
    name: control-plane check + workerd tests + dry run
    if: (github.event_name != 'workflow_dispatch' || !inputs.install_probe) && (github.event_name != 'workflow_dispatch' || !inputs.upgrade_only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm control-plane:check
      - run: pnpm control-plane:test
      - run: pnpm control-plane:dry-run

  package-linux:
    name: package + smoke (Ubuntu 24.04 x64)
    if: (github.event_name != 'workflow_dispatch' || !inputs.install_probe) && (github.event_name != 'workflow_dispatch' || !inputs.upgrade_only)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install package validation and native smoke tools
        run: >-
          sudo apt-get update && sudo apt-get install -y
          at-spi2-core dbus-x11 desktop-file-utils libxi6 libxkbcommon0 squashfs-tools x11-utils xdotool xvfb
      - run: pnpm install --frozen-lockfile
      - name: Stage the pinned CUA runtime
        run: pnpm build:cua:linux
      - name: Prove overlay-free X11 input routing
        run: dbus-run-session -- xvfb-run -a pnpm smoke:cua-x11-input
      - name: Package from the verified offline CUA stage
        run: pnpm package:linux:offline
      - run: node scripts/verify-linux-package.mjs
      - name: Match a normal Ubuntu package parent on the ephemeral runner
        run: |
          test ! -L /opt
          test "$(stat -c '%F %U:%G' /opt)" = "directory root:root"
          case "$(stat -c '%a' /opt)" in
            755) ;;
            775|777) sudo chmod 0755 /opt ;;
            *) echo "Unexpected /opt mode: $(stat -c '%a' /opt)" >&2; exit 1 ;;
          esac
          test "$(stat -c '%U:%G %a' /opt)" = "root:root 755"
      - name: Reproduce and verify an in-place DEB upgrade
        run: |
          deb=(release/*.deb)
          test "${#deb[@]}" -eq 1
          sudo --preserve-env=CI,RUNNER_TEMP node scripts/smoke-deb-upgrade.mjs "${deb[0]}"
      - name: Configure Chromium sandbox for the unpacked app
        run: |
          sudo chown root:root release/linux-unpacked/chrome-sandbox
          sudo chmod 4755 release/linux-unpacked/chrome-sandbox
          test "$(stat -c '%U:%G %a' release/linux-unpacked/chrome-sandbox)" = "root:root 4755"
      - name: Launch packaged app and verify lifecycle
        env:
          OMB_KEEP_SMOKE_DIR: "1"
          OMB_SMOKE_INSTALLED_DEB: "1"
        run: pnpm smoke:linux-package
      - name: Remove the installed upgrade fixture
        if: always()
        run: sudo dpkg --purge danibot || true
      - name: Upload smoke diagnostics on failure
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: danibot-ubuntu-smoke-diagnostics
          path: |
            /tmp/omb-linux-smoke-*
            /tmp/omb-linux-smoke-runtime-*
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7

  # hashFiles cannot run in a job-level `if` (no workspace exists at
  # evaluation time), so a small job checks out and reports what exists.
  detect-optional-jobs:
    name: Detect optional jobs
    if: (github.event_name != 'workflow_dispatch' || !inputs.install_probe) && (github.event_name != 'workflow_dispatch' || !inputs.upgrade_only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ios: ${{ steps.detect.outputs.ios }}
      android: ${{ steps.detect.outputs.android }}
      sdd: ${{ steps.detect.outputs.sdd }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: detect
        run: |
          { [ -f ios/Package.swift ] && echo "ios=true" || echo "ios=false"; } >> "$GITHUB_OUTPUT"
          { find . -name gradlew -print -quit | grep -q . && echo "android=true" || echo "android=false"; } >> "$GITHUB_OUTPUT"
          { [ -f docs/dani-sdd-kit/scripts/check_kit.py ] && echo "sdd=true" || echo "sdd=false"; } >> "$GITHUB_OUTPUT"

  ios:
    name: Swift tests + iOS build
    # This repo does not contain the iOS package yet; run only when it appears.
    needs: detect-optional-jobs
    if: (github.event_name != 'workflow_dispatch' || !inputs.install_probe) && (github.event_name != 'workflow_dispatch' || !inputs.upgrade_only) && (needs.detect-optional-jobs.outputs.ios == 'true')
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Swift package tests
        run: swift test --package-path ios
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd ios
          xcodegen generate
      - name: Build the simulator app
        run: |
          cd ios
          xcodebuild \
            -project DaniCompanion.xcodeproj \
            -scheme DaniCompanion \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

  # Deliberately not scoped to android/**: :core's test fixtures are read from
  # ios/Tests/CompanionCoreTests/Fixtures, so a path filter would skip the
  # Kotlin suite on exactly the change that breaks it.
  android:
    name: Kotlin tests + Android build
    # This repo does not contain a Gradle project yet; run only when it appears.
    needs: detect-optional-jobs
    if: (github.event_name != 'workflow_dispatch' || !inputs.install_probe) && (github.event_name != 'workflow_dispatch' || !inputs.upgrade_only) && (needs.detect-optional-jobs.outputs.android == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          # Robolectric fetches android-all-instrumented from Maven Central at
          # *test* time into ~/.m2 — 278 MB per clean machine that no Gradle
          # cache reaches. This replaces the action's default path, so
          # ~/.gradle/caches has to be named alongside it.
          cache-path: |
            ~/.gradle/caches
            ~/.m2/repository/org/robolectric
      - name: Kotlin tests and a debug APK
        run: |
          cd android
          ./gradlew --no-daemon :core:test :app:testDebugUnitTest :app:assembleDebug
      - name: Upload the Android test reports on failure
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: android-test-reports
          path: |
            android/core/build/reports/tests
            android/core/build/test-results
            android/app/build/reports/tests
            android/app/build/test-results
          if-no-files-found: warn
          retention-days: 7

  install-probe-old-windows:
    name: startup timing probe - published Windows x64
    if: github.event_name == 'workflow_dispatch' && inputs.upgrade_only != true && (github.ref == 'refs/heads/ci-validate-4c2157b2' || inputs.install_probe)
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      PROBE_PORT: "8799"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the published v0.1.58 Windows artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          curl -sL -o old-portable.zip https://github.com/somdipto/dani-desktop/releases/download/v0.1.58/DaniBot-Windows-Portable.zip
          curl -sL -o old-setup.exe https://github.com/somdipto/dani-desktop/releases/download/v0.1.58/DaniBot-0.1.58-setup.exe
      - name: Time portable extraction and silent NSIS install
        shell: pwsh
        run: |
          $m = Measure-Command { Expand-Archive -Path .\old-portable.zip -DestinationPath .\old-app }
          "portable_extract_ms=$([int]$m.TotalMilliseconds)" | Tee-Object -FilePath results/install-timings.txt
          $n = Measure-Command { Start-Process -FilePath .\old-setup.exe -ArgumentList '/S' -Wait }
          "nsis_silent_install_ms=$([int]$n.TotalMilliseconds)" | Tee-Object -FilePath results/install-timings.txt -Append
      - name: Probe cold launch (published build)
        shell: bash
        env:
          PROBE_EXE: "old-app/Dani Bot.exe"
          PROBE_OUT: "results/probe-old-windows-cold.json"
          PROBE_LOG: "results/probe-old-windows-cold.log"
          PROBE_BOOTSTRAP: "1"
        run: node scripts/install-timing-probe.mjs
      - name: Probe warm relaunch (published build)
        shell: bash
        env:
          PROBE_EXE: "old-app/Dani Bot.exe"
          PROBE_OUT: "results/probe-old-windows-warm.json"
          PROBE_LOG: "results/probe-old-windows-warm.log"
          PROBE_BOOTSTRAP: "1"
        run: node scripts/install-timing-probe.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: install-probe-old-windows
          path: results/
          if-no-files-found: error

  install-probe-old-mac-intel:
    name: startup timing probe - published macOS Intel
    if: github.event_name == 'workflow_dispatch' && inputs.upgrade_only != true && (github.ref == 'refs/heads/ci-validate-4c2157b2' || inputs.install_probe)
    runs-on: macos-15-intel
    timeout-minutes: 40
    env:
      PROBE_PORT: "8799"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the published v0.1.58 Intel dmg
        run: |
          set -euo pipefail
          mkdir -p results
          curl -sL -o old.dmg https://github.com/somdipto/dani-desktop/releases/download/v0.1.58/DaniBot-0.1.58-x64.dmg
      - name: Time dmg mount and app copy (install phase)
        run: |
          set -euo pipefail
          start=$(python3 -c 'import time; print(int(time.time()*1000))'); hdiutil attach -nobrowse -mountpoint /tmp/oldmnt old.dmg >/dev/null; end=$(python3 -c 'import time; print(int(time.time()*1000))')
          echo "dmg_attach_ms=$((end-start))" | tee results/install-timings.txt
          start=$(python3 -c 'import time; print(int(time.time()*1000))'); cp -R "/tmp/oldmnt/Dani Bot.app" /tmp/old.app; end=$(python3 -c 'import time; print(int(time.time()*1000))')
          echo "app_copy_ms=$((end-start))" | tee -a results/install-timings.txt
          hdiutil detach /tmp/oldmnt >/dev/null
      - name: Probe cold launch (published build)
        env:
          PROBE_EXE: "/tmp/old.app/Contents/MacOS/Dani Bot"
          PROBE_OUT: "results/probe-old-mac-intel-cold.json"
          PROBE_LOG: "results/probe-old-mac-intel-cold.log"
          PROBE_BOOTSTRAP: "1"
        run: node scripts/install-timing-probe.mjs
      - name: Probe warm relaunch (published build)
        env:
          PROBE_EXE: "/tmp/old.app/Contents/MacOS/Dani Bot"
          PROBE_OUT: "results/probe-old-mac-intel-warm.json"
          PROBE_LOG: "results/probe-old-mac-intel-warm.log"
          PROBE_BOOTSTRAP: "1"
        run: node scripts/install-timing-probe.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: install-probe-old-mac-intel
          path: results/
          if-no-files-found: error

  install-probe-new-windows:
    name: startup timing probe - current Windows x64 build
    if: github.event_name == 'workflow_dispatch' && inputs.upgrade_only != true && (github.ref == 'refs/heads/ci-validate-4c2157b2' || inputs.install_probe)
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      PROBE_PORT: "8799"
      ARTIFACT_RUN_ID: "41567356622"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the current build's Windows artifact
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p results
          artifact_id=$(curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/$ARTIFACT_RUN_ID/artifacts?per_page=100" \
            | jq -r '.artifacts[] | select(.name=="windows-release") | .id')
          curl -sL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$artifact_id/zip" -o windows-release.zip
          mkdir -p windows-release && unzip -q windows-release.zip -d windows-release
      - name: Time portable extraction
        shell: pwsh
        run: |
          $m = Measure-Command { Expand-Archive -Path .\windows-release\DaniBot-Windows-Portable.zip -DestinationPath .\new-app }
          "portable_extract_ms=$([int]$m.TotalMilliseconds)" | Tee-Object -FilePath results/install-timings.txt
      - name: Probe cold launch (current build)
        shell: bash
        env:
          PROBE_EXE: "new-app/Dani Bot.exe"
          PROBE_OUT: "results/probe-new-windows-cold.json"
          PROBE_LOG: "results/probe-new-windows-cold.log"
        run: node scripts/install-timing-probe.mjs
      - name: Probe warm relaunch (current build)
        shell: bash
        env:
          PROBE_EXE: "new-app/Dani Bot.exe"
          PROBE_OUT: "results/probe-new-windows-warm.json"
          PROBE_LOG: "results/probe-new-windows-warm.log"
        run: node scripts/install-timing-probe.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: install-probe-new-windows
          path: results/
          if-no-files-found: error

  install-probe-new-mac-intel:
    name: startup timing probe - current macOS Intel build
    if: github.event_name == 'workflow_dispatch' && inputs.upgrade_only != true && (github.ref == 'refs/heads/ci-validate-4c2157b2' || inputs.install_probe)
    runs-on: macos-15-intel
    timeout-minutes: 40
    env:
      PROBE_PORT: "8799"
      ARTIFACT_RUN_ID: "41567356622"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the current build's macOS artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p results
          artifact_id=$(curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/$ARTIFACT_RUN_ID/artifacts?per_page=100" \
            | jq -r '.artifacts[] | select(.name=="macos-release") | .id')
          curl -sL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$artifact_id/zip" -o macos-release.zip
          mkdir -p macos-release && unzip -q macos-release.zip -d macos-release
      - name: Time portable extraction
        run: |
          set -euo pipefail
          start=$(python3 -c 'import time; print(int(time.time()*1000))'); mkdir -p new-app && unzip -q macos-release/DaniBot-Intel-Portable.zip -d new-app; end=$(python3 -c 'import time; print(int(time.time()*1000))')
          echo "portable_extract_ms=$((end-start))" | tee results/install-timings.txt
      - name: Probe cold launch (current build)
        env:
          PROBE_EXE: "new-app/Dani Bot.app/Contents/MacOS/Dani Bot"
          PROBE_OUT: "results/probe-new-mac-intel-cold.json"
          PROBE_LOG: "results/probe-new-mac-intel-cold.log"
        run: node scripts/install-timing-probe.mjs
      - name: Probe warm relaunch (current build)
        env:
          PROBE_EXE: "new-app/Dani Bot.app/Contents/MacOS/Dani Bot"
          PROBE_OUT: "results/probe-new-mac-intel-warm.json"
          PROBE_LOG: "results/probe-new-mac-intel-warm.log"
        run: node scripts/install-timing-probe.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: install-probe-new-mac-intel
          path: results/
          if-no-files-found: error

  install-probe-new-mac-arm64:
    name: startup timing probe - current macOS arm64 build
    if: github.event_name == 'workflow_dispatch' && inputs.upgrade_only != true && (github.ref == 'refs/heads/ci-validate-4c2157b2' || inputs.install_probe)
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      PROBE_PORT: "8799"
      ARTIFACT_RUN_ID: "41625636597"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the current build's macOS artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p results
          artifact_id=$(curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/$ARTIFACT_RUN_ID/artifacts?per_page=100" \
            | jq -r '.artifacts[] | select(.name=="macos-release") | .id')
          curl -sL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$artifact_id/zip" -o macos-release.zip
          mkdir -p macos-release && unzip -q macos-release.zip -d macos-release
      - name: Time portable extraction
        run: |
          set -euo pipefail
          start=$(python3 -c 'import time; print(int(time.time()*1000))'); mkdir -p new-app && unzip -q macos-release/DaniBot-Silicon-Portable.zip -d new-app; end=$(python3 -c 'import time; print(int(time.time()*1000))')
          echo "portable_extract_ms=$((end-start))" | tee results/install-timings.txt
      - name: Probe cold launch (current build)
        env:
          PROBE_EXE: "new-app/Dani Bot.app/Contents/MacOS/Dani Bot"
          PROBE_OUT: "results/probe-new-mac-arm64-cold.json"
          PROBE_LOG: "results/probe-new-mac-arm64-cold.log"
        run: node scripts/install-timing-probe.mjs
      - name: Probe warm relaunch (current build)
        env:
          PROBE_EXE: "new-app/Dani Bot.app/Contents/MacOS/Dani Bot"
          PROBE_OUT: "results/probe-new-mac-arm64-warm.json"
          PROBE_LOG: "results/probe-new-mac-arm64-warm.log"
        run: node scripts/install-timing-probe.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: install-probe-new-mac-arm64
          path: results/
          if-no-files-found: error

  capture-locked-signins-ui:
    name: UI capture - locked sign-ins notice (Linux xvfb, candidate build)
    if: github.event_name == 'workflow_dispatch' && inputs.upgrade_only != true && (github.ref == 'refs/heads/ci-validate-4c2157b2' || inputs.install_probe)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      ARTIFACT_RUN_ID: "41625636597"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: sudo apt-get update && sudo apt-get install -y xvfb dbus-x11 zstd
      - name: Download the current build's Linux artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          artifact_id=$(curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/$ARTIFACT_RUN_ID/artifacts?per_page=100" \
            | jq -r '.artifacts[] | select(.name=="linux-release") | .id')
          curl -sL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$artifact_id/zip" -o linux-release.zip
          mkdir -p linux-release && unzip -q linux-release.zip -d linux-release
      - name: Extract the candidate deb without installing it
        run: |
          set -euo pipefail
          mkdir -p candidate && cd candidate
          ar x ../linux-release/danibot-amd64.deb
          tar -xf data.tar.*
          find opt -maxdepth 3 -type f -name 'danibot' | head -1 > ../candidate-exe.txt
          cat ../candidate-exe.txt
      - name: Capture the locked sign-ins notice
        run: |
          set -euo pipefail
          exe="candidate/$(cat candidate-exe.txt)"
          test -x "$exe" || chmod +x "$exe"
          xvfb-run -a --server-args="-screen 0 1600x1000x24" \
            node scripts/capture-product-pages.mjs --exe "$exe" --out shots \
            --seed-unreadable-credentials \
            --steps "^Set up later$|^Connect apps$" \
            --require "Saved sign-ins couldn't be unlocked" \
            --require "Try again"
          ls -la shots/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ui-capture-locked-signins
          path: shots
          if-no-files-found: warn

  install-probe-upgrade-windows:
    name: upgrade-over-data probe - branch Windows x64
    if: github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/ci-validate-4c2157b2' || inputs.install_probe)
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      DANI_PROFILE_PROBE: "1"
      PROBE_PORT: "8799"
      ARTIFACT_RUN_ID: "41625636597"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download published and branch Windows packages
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p results
          curl -sL -o old-portable.zip https://github.com/somdipto/dani-desktop/releases/download/v0.1.58/DaniBot-Windows-Portable.zip
          artifact_id=$(curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/$ARTIFACT_RUN_ID/artifacts?per_page=100" \
            | jq -r '.artifacts[] | select(.name=="windows-release") | .id')
          curl -sL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$artifact_id/zip" -o branch-release.zip
          mkdir -p branch-release && unzip -q branch-release.zip -d branch-release
      - name: Run the published build to create existing app data
        shell: bash
        run: |
          set -euo pipefail
          powershell -NoProfile -Command "Expand-Archive -Path .\old-portable.zip -DestinationPath .\old-app"
      - name: Probe the published build briefly
        shell: bash
        env:
          PROBE_EXE: "old-app/Dani Bot.exe"
          PROBE_OUT: "results/probe-upgrade-windows-oldseed.json"
          PROBE_LOG: "results/probe-upgrade-windows-oldseed.log"
          PROBE_BOOTSTRAP: "1"
          PROBE_BUDGET_MIN: "2"
        run: node scripts/install-timing-probe.mjs
      - name: Locate existing app data, inventory it and plant a marker
        shell: bash
        run: |
          set -euo pipefail
          data=""
          for try in $(seq 1 12); do
            for candidate in "$APPDATA/dani-desktop" "$APPDATA/Dani Bot"; do
              if [ -d "$candidate" ]; then data="$candidate"; break; fi
            done
            [ -n "$data" ] && break
            sleep 5
          done
          if [ -z "$data" ]; then
            echo "published build created no app data; APPDATA contains:"
            ls -la "$APPDATA" || true
            exit 1
          fi
          echo "existing app data at $data"
          # Record which directory the published build itself created, and every
          # top-level name under APPDATA (names only), so later steps compare the
          # candidate against the profile the published build actually used.
          basename "$data" > results/old-profile-dir.txt
          printf '%s\n' "$data" > results/old-profile-path.txt
          (cd "$data" && find . -type f -printf '%s|%p\n' | LC_ALL=C sort) > results/inventory-old.txt
          echo "synthetic upgrade marker - not user data" > "$data/probe-marker.txt"
          wc -l < results/inventory-old.txt | tr -d ' ' > results/inventory-old-count.txt
          mkdir -p "$RUNNER_TEMP/upgradecmp"
          (cd "$data" && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "$RUNNER_TEMP/upgradecmp/sums-old.txt"
      - name: Capture published profile logs before candidate launch
        shell: bash
        run: |
          set -eu
          for n in "Dani Bot" "dani-desktop"; do
            if [ -d "$APPDATA/$n/logs" ]; then
              mkdir -p "results/published-logs/$n"
              cp -R "$APPDATA/$n/logs/." "results/published-logs/$n/"
            fi
          done
      - name: Probe cold launch of the branch build over existing data
        shell: bash
        env:
          PROBE_EXE: "new-app/Dani Bot.exe"
          PROBE_OUT: "results/probe-upgrade-windows-cold.json"
          PROBE_LOG: "results/probe-upgrade-windows-cold.log"
          PROBE_EXPECT_NO_BOOTSTRAP: "1"
          PROBE_REQUIRE_READY: "1"
        run: |
          set -euo pipefail
          powershell -NoProfile -Command "Expand-Archive -Path .\branch-release\DaniBot-Windows-Portable.zip -DestinationPath .\new-app"
          node scripts/install-timing-probe.mjs
      - name: Probe warm relaunch of the branch build
        shell: bash
        env:
          PROBE_EXE: "new-app/Dani Bot.exe"
          PROBE_OUT: "results/probe-upgrade-windows-warm.json"
          PROBE_LOG: "results/probe-upgrade-windows-warm.log"
          PROBE_EXPECT_NO_BOOTSTRAP: "1"
          PROBE_REQUIRE_READY: "1"
        run: node scripts/install-timing-probe.mjs
      - name: Verify old data preserved
        shell: bash
        run: |
          set -euo pipefail
          data="$APPDATA/$(cat results/old-profile-dir.txt)"
          [ -f "$data/probe-marker.txt" ] || { echo "upgrade lost the planted marker"; exit 1; }
          (cd "$data" && find . -type f -printf '%s|%p\n' | LC_ALL=C sort) > results/inventory-new.txt
          missing=$(LC_ALL=C comm -23 <(cut -d'|' -f2- results/inventory-old.txt | LC_ALL=C sort) <(cut -d'|' -f2- results/inventory-new.txt | LC_ALL=C sort) || true)
          if [ -n "$missing" ]; then
            { echo "MISSING AFTER UPGRADE:"; echo "$missing"; } > results/upgrade-diff.txt
            echo "upgrade dropped pre-existing files (see upgrade-diff.txt)"; exit 1
          fi
          # Content comparison stays on the runner; only counts and allowlisted safe names reach the artifact.
          work="$RUNNER_TEMP/upgradecmp"
          (cd "$data" && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "$work/sums-new.txt"
          oldcount=$(wc -l < results/inventory-old.txt | tr -d ' ')
          identical=0; changed_sensitive=0; : > "$work/changed-safe.txt"
          while IFS='|' read -r size rel; do
            oldhash=$(awk -v r="$rel" '{ h=$1; sub(/^[0-9a-f]+ [ *]/, ""); if ($0 == r) print h }' "$work/sums-old.txt")
            newhash=$(awk -v r="$rel" '{ h=$1; sub(/^[0-9a-f]+ [ *]/, ""); if ($0 == r) print h }' "$work/sums-new.txt")
            if [ -n "$oldhash" ] && [ "$oldhash" = "$newhash" ]; then
              identical=$((identical+1))
            else
              case "$rel" in
                ./probe-marker.txt|./window-state.json) echo "$rel" >> "$work/changed-safe.txt" ;;
                *) changed_sensitive=$((changed_sensitive+1)) ;;
              esac
            fi
          done < results/inventory-old.txt
          added=$(LC_ALL=C comm -13 <(cut -d'|' -f2- results/inventory-old.txt | LC_ALL=C sort) <(cut -d'|' -f2- results/inventory-new.txt | LC_ALL=C sort) | wc -l | tr -d ' ')
          {
            echo "all $oldcount pre-existing files present after upgrade (name+size)"
            echo "content-identical pre-existing files: $identical"
            echo "content-changed, safe-named files: $(wc -l < "$work/changed-safe.txt" | tr -d ' ')"
            cat "$work/changed-safe.txt"
            echo "content-changed or unverifiable, sensitive-named files (count only): $changed_sensitive"
            echo "files added by the new build (count only): $added"
          } > results/upgrade-diff.txt
      - name: Assert the candidate used the prior profile directory
        shell: bash
        run: |
          node scripts/verify-upgrade-profile.mjs results/old-profile-path.txt results/probe-upgrade-windows-cold.log results/profile-use.json
      - name: Record candidate asar provenance
        if: always()
        shell: bash
        run: |
          set -u
          ASAR=$(find new-app -name app.asar 2>/dev/null | head -1 || true)
          {
            echo "asar: ${ASAR:-not found}"
            if [ -n "$ASAR" ]; then
              shasum -a 256 "$ASAR" 2>/dev/null || sha256sum "$ASAR"
              for m in checkCredentialAvailable 'startup: server fork begin' 'the credential store did not answer in time'; do
                if grep -q -F "$m" "$ASAR"; then echo "marker PRESENT: $m"; else echo "marker MISSING: $m"; fi
              done
            fi
          } > results/provenance.txt
      - name: Capture app logs and system evidence
        if: always()
        shell: bash
        run: |
          set -u
          for n in "Dani Bot" "dani-desktop"; do
            if [ -d "$APPDATA/$n" ]; then
              (cd "$APPDATA/$n" && find . -type f | LC_ALL=C sort) > "results/profile-names-$n.txt"
            else
              echo absent > "results/profile-names-$n.txt"
            fi
          done
          # One folder per directory so old and candidate logs never overwrite each other.
          for n in "Dani Bot" "dani-desktop"; do
            mkdir -p "results/app-logs/$n"
            if [ -d "$APPDATA/$n/logs" ]; then cp -R "$APPDATA/$n/logs/." "results/app-logs/$n/" 2>/dev/null || true; fi
          done
      - name: Redact token-shaped strings from logs before upload
        if: always()
        shell: bash
        run: |
          find results -type f -name '*.log' | while IFS= read -r f; do
            perl -pi -e 's/omb_sess_[A-Za-z0-9_-]+/[redacted]/g; s/(Bearer|api[_-]?key|token)[=: ]+[A-Za-z0-9._~-]{8,}/$1=[redacted]/gi' "$f" || true
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: install-probe-upgrade-windows
          path: results/
          if-no-files-found: warn

