# Unsigned macOS packages (arm64 + Intel), built on a real macOS runner and kept
# as a workflow artifact only. Never creates a release or a public feed.
# These builds have no Apple Developer ID signature and are not notarized:
# Gatekeeper may block them and macOS auto-update cannot be relied on.
name: Package macOS

on:
  # the dispatch button only exists for workflows on the default branch, so this
  # integration branch builds when this file itself changes
  push:
    branches: [integration/dani-rebrand]
    paths: [.github/workflows/package-mac.yml]
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit/tag/branch to build (defaults to the branch this is run from)"
        required: false
        type: string

jobs:
  package:
    name: macOS arm64 + Intel (unsigned)
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: clean build outputs
        run: rm -rf dist dist-server release
      # package:mac stages cloudflared (both Mac arches, via package:prepare) and the pinned Dani Free proxy
      # (both arches); electron-builder's beforePack rejects a missing or mismatched binary.
      - run: pnpm package:mac
      - name: report what was built
        shell: bash
        run: |
          echo "version: $(node -p "require('./package.json').version")"
          echo "commit:  $(git rev-parse HEAD)"
          ls -lh release/*.dmg release/*.zip release/*.yml
          for app in release/mac*/*.app; do
            echo "== $app"; ls "$app/Contents/Resources" | head -30
            codesign -dv "$app" 2>&1 | head -5 || true
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dani-macos-unsigned
          path: |
            release/DaniBot-*.dmg
            release/DaniBot-*.zip
          if-no-files-found: error
          retention-days: 7
