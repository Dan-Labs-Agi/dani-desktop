name: Retained Intel exact-byte native revalidation
true:
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: retained-intel-native-isolation
  cancel-in-progress: false
jobs:
  build_install_download:
    if: github.ref == 'refs/heads/fix/intel-private-delivery-20261109'
    runs-on: macos-15-intel
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      DANI_VERIFY_FREE_INSTALL: '1'
      DANIBOT_CUA_ARCHES: x64
      DANIBOT_CUA_ARCHES_PARTIAL: '1'
      NODE_OPTIONS: --max-old-space-size=7168
      CANDIDATE_SOURCE: f36ad5a776917c38c455e6beb1d285af3715e002
      CANDIDATE_TAG: v0.1.139-intel-preview.1
      GH_REPO: ${{ github.repository }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: 31886634e959d73c5bdbe6a2ca7d015544a897f0
        persist-credentials: false
    - name: Inspect existing native account Keychain metadata without changes
      run: 'set -euo pipefail

        python3 - <<''PY''

        import os,pwd,pathlib,subprocess,json

        home=pwd.getpwuid(os.getuid()).pw_dir

        result=subprocess.run([''/usr/bin/security'',''default-keychain'',''-d'',''user''],capture_output=True,text=True,timeout=10)

        default=result.stdout.strip().strip(''"'')

        record={''HOME'':os.environ.get(''HOME''),''account_home'':home,''keychain_directory_exists'':pathlib.Path(home,''Library'',''Keychains'').is_dir(),''default_query_status'':result.returncode,''default_keychain'':default,''default_exists'':bool(default)
        and pathlib.Path(default).is_file()}

        print(''DANI_NATIVE_KEYCHAIN_METADATA ''+json.dumps(record))

        assert os.environ.get(''HOME'')==home,''Native HOME mismatch; do not alter Keychain''

        assert result.returncode==0 and record[''default_exists''],''No existing default Keychain; stop before build, no reset/create/unlock''

        PY

        '
    - name: Verify retained exact bytes twice without rebuilding or replacing installer
      env:
        GH_TOKEN: ${{ github.token }}
      run: "set -euo pipefail\nmkdir release\ngh release view \"$CANDIDATE_TAG\" --json isDraft,targetCommitish,url,assets > \"$RUNNER_TEMP/candidate.json\"\
        \npython3 - <<'PY'\nimport json,os\nr=json.load(open(os.environ['RUNNER_TEMP']+'/candidate.json'))\nassert r['isDraft'] and\
        \ r['targetCommitish']==os.environ['CANDIDATE_SOURCE']\nprint('RETAINED_CANDIDATE '+r['url'])\nPY\ngh release download \"$CANDIDATE_TAG\"\
        \ --pattern DaniBot-0.1.139-x64.dmg --pattern CANDIDATE.json --dir release\npython3 - <<'PY'\nimport json,pathlib,hashlib,os\n\
        r=json.load(open('release/CANDIDATE.json'));f=pathlib.Path('release')/r['filename']\nassert r['source']==os.environ['CANDIDATE_SOURCE']\n\
        assert r['bytes']==327719528 and r['sha256']=='6d0ba0cb1cbf5b8b6304be720f627ac8f7dc807dc7f3021fef297ea513d5b37a'\nassert f.stat().st_size==r['bytes']\
        \ and hashlib.sha256(f.read_bytes()).hexdigest()==r['sha256']\nprint('RETAINED_EXACT_BYTES '+json.dumps(r))\nPY\nnpm install\
        \ --prefix \"$RUNNER_TEMP/smoke-tools\" --no-audit --no-fund playwright-core@1.56.1\nfor pass in first second; do\n  mkdir \"\
        $RUNNER_TEMP/$pass-profile\"\n  ln -s \"$RUNNER_TEMP/smoke-tools\" \"$RUNNER_TEMP/$pass-profile/smoke-tools\"\n  RUNNER_TEMP=\"\
        $RUNNER_TEMP/$pass-profile\" GITHUB_SHA=\"$CANDIDATE_SOURCE\" node scripts/verify-main-mac-installed.cjs | tee \"$RUNNER_TEMP/$pass-native.log\"\
        \n  grep -q DANI_FREE_PACKAGED_BUTTON_INSTALL_PASS \"$RUNNER_TEMP/$pass-native.log\"\n  grep -q MAIN_INSTALLED_RELAUNCH_PASS\
        \ \"$RUNNER_TEMP/$pass-native.log\"\n  grep -q MAIN_INSTALLED_AVATAR_PRESENTATION_PASS \"$RUNNER_TEMP/$pass-native.log\"\ndone\n\
        python3 - <<'PY'\nimport json,pathlib\np=pathlib.Path('release/CANDIDATE.json');r=json.loads(p.read_text());r['downloaded_native_validation']='passed';r['verification_source']='31886634e959d73c5bdbe6a2ca7d015544a897f0';r['downloaded_native_passes']=2;p.write_text(json.dumps(r,indent=2)+'\\\
        n')\nPY\ngh release view \"$CANDIDATE_TAG\" --json isDraft,targetCommitish > \"$RUNNER_TEMP/final.json\"\npython3 - <<'PY'\n\
        import json,os\nr=json.load(open(os.environ['RUNNER_TEMP']+'/final.json'));assert r['isDraft'] and r['targetCommitish']==os.environ['CANDIDATE_SOURCE']\n\
        PY\ngh release upload \"$CANDIDATE_TAG\" release/CANDIDATE.json --clobber\ngh release view \"$CANDIDATE_TAG\" --json isDraft,targetCommitish,url,assets\n"
