name: Main Windows installed validation
on:
  pull_request:
    branches: [main, prod]
  push:
    branches: [fix/main-installed-release-gate-20261108]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installed:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      DANI_VERIFY_FREE_INSTALL: '1'
      OMB_AI_CHECKS: '0'
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global pnpm@10.33.0 --no-audit --no-fund
      - run: pnpm install --frozen-lockfile
      - run: node --test electron/startup-tray.node-test.mjs scripts/source-installer.node-test.mjs
      - run: pnpm package:win
      - run: npm install --prefix "$env:RUNNER_TEMP/smoke-tools" --no-audit --no-fund playwright-core@1.56.1
        shell: pwsh
      - run: node scripts/verify-main-installed.cjs
      # No storage upload, release, cache, draft, tag or deployment writes.

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMB_AI_CHECKS: '0'
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global pnpm@10.33.0 --no-audit --no-fund
      - run: pnpm install --frozen-lockfile
      - run: node --test scripts/release-pipeline.node-test.mjs
      - run: pnpm exec vitest run server/dani-free-runtime-lifecycle.test.ts server/dani-free-runtime.test.ts server/drivers/dani-free.test.ts server/dani-free-setup.test.ts server/engine-standalone.test.ts server/routes/instances.test.ts server/tested-ai.test.ts
      - name: Require an unused release version before merge
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: node scripts/release-staging.mjs check-version v$(node -p "require('./package.json').version") ${{ github.sha }}
      - run: pnpm exec vite build
      - run: node scripts/bundle-server.mjs
      # No artifact upload, cache, Docker, model call or publication.

  tools:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      OMB_AI_CHECKS: '0'
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global pnpm@10.33.0 --no-audit --no-fund
      - run: pnpm install --frozen-lockfile
      - run: node --experimental-transform-types scripts/verify-dani-free-tools.mts
      # No model service start, artifacts, caches, spending or release publication.
