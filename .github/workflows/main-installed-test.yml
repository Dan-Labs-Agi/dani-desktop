name: Main Windows installed validation
on:
  push:
    branches: [fix/main-installed-release-gate-20261108]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installed:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global pnpm@10.33.0 --no-audit --no-fund
      - run: pnpm install --frozen-lockfile
      - run: node --test electron/startup-tray.node-test.mjs scripts/source-installer.node-test.mjs
      - run: pnpm package:win
      - run: npm install --prefix "$env:RUNNER_TEMP/smoke-tools" --no-audit --no-fund playwright-core@1.56.1
        shell: pwsh
      - run: node scripts/verify-main-installed.cjs
      # No storage upload, release, cache, draft, tag or deployment writes.
