# Real-product screenshots: builds the unpacked Linux desktop app, launches it under a virtual display with an
# empty profile and captures what its window actually shows. The PNGs and a tour.json (visible headings and
# buttons per step) are uploaded as an artifact. Artifact-only; nothing is published.
name: Product screenshots

on:
  push:
    branches: [integration/dani-rebrand]
    paths: [.github/workflows/screenshots.yml, scripts/capture-product-pages.mjs]
  workflow_dispatch:
    inputs:
      steps:
        description: "Control labels to click in order, separated by |"
        required: false
        type: string

jobs:
  capture:
    name: Linux desktop (xvfb)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y xvfb dbus-x11
      - run: pnpm package:linux:dir
      - name: Capture
        env:
          STEPS: ${{ inputs.steps || '+^Next$|^You$|^Settings$|ESC|^You$|^About$|ESC' }}
        run: |
          exe=$(ls release/linux-unpacked/danibot)
          xvfb-run -a --server-args="-screen 0 1600x1000x24" \
            node scripts/capture-product-pages.mjs --exe "$exe" --out shots \
            --steps "$STEPS"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: dani-product-screenshots
          path: shots
          if-no-files-found: error
          retention-days: 7
