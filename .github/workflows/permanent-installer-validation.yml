# Native desktop release builds. Each package is built on the OS it runs on,
# then staged directly as release assets, verified and published only after all gates pass.
name: Permanent installer validation

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit, tag, or branch to release (defaults to the selected branch)"
        required: false
        type: string
      retained_source_sha:
        description: "Download-only: exact source SHA of an existing immutable private validation draft"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # A newer push to the same branch supersedes an older build. Tags and manual
  # runs use their own refs, so they do not cancel branch releases.
  group: permanent-installer-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Pin release commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      version: ${{ steps.release.outputs.version }}
      short: ${{ steps.release.outputs.short }}
      verifier_sha: ${{ steps.release.outputs.verifier_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RETAINED_SOURCE_SHA: ${{ inputs.retained_source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          echo "verifier_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          sha=$(git rev-parse HEAD)
          if [ -n "$RETAINED_SOURCE_SHA" ]; then
            [[ "$RETAINED_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
            sha="$RETAINED_SOURCE_SHA"
          fi
          version=$(node -p "require('./package.json').version")
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=${sha:0:12}" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Stage an immutable private validation draft, never publish
        if: github.event_name != 'pull_request' && inputs.retained_source_sha == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-staging.mjs prepare v${{ steps.release.outputs.version }}-validation.${{ steps.release.outputs.short }} ${{ steps.release.outputs.sha }}

  linux:
    if: inputs.retained_source_sha == ''
    permissions:
      contents: write
    name: Linux x64 (AppImage + deb)
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OMB_AI_CHECKS: "0"
      NODE_OPTIONS: "--max-old-space-size=7168"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global pnpm@10.33.0 --no-audit --no-fund
      - run: pnpm install --frozen-lockfile
      - name: Stage pinned cloudflared for Linux
        run: node scripts/prepare-cloudflared.mjs
      - name: Build Linux packages
        run: pnpm package:linux
      - name: Install Linux desktop metadata validator
        run: sudo apt-get update && sudo apt-get install -y desktop-file-utils
      - run: node scripts/verify-linux-package.mjs
      - name: Verify release files
        shell: bash
        run: |
          set -euo pipefail
          test -f release/DaniBot-${{ needs.prepare.outputs.version }}-x86_64.AppImage
          test -f release/DaniBot-${{ needs.prepare.outputs.version }}-amd64.deb
          test -f release/latest-linux.yml
      - name: Create stable download names
        shell: bash
        run: |
          set -euo pipefail
          version=${{ needs.prepare.outputs.version }}
          cp "release/DaniBot-$version-x86_64.AppImage" release/DaniBot.AppImage
          cp "release/DaniBot-$version-amd64.deb" release/danibot-amd64.deb
          test -s release/DaniBot.AppImage
          test -s release/danibot-amd64.deb
      - name: Upload verified packages directly to private release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-staging.mjs upload v${{ needs.prepare.outputs.version }}-validation.${{ needs.prepare.outputs.short }} ${{ needs.prepare.outputs.sha }} linux

  windows:
    if: inputs.retained_source_sha == ''
    permissions:
      contents: write
    name: Windows x64 (NSIS)
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      DANI_VERIFY_FREE_INSTALL: "1"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      OMB_AI_CHECKS: "0"
      NODE_OPTIONS: "--max-old-space-size=7168"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global pnpm@10.33.0 --no-audit --no-fund
      - run: pnpm install --frozen-lockfile
      - name: Stage pinned cloudflared for Windows
        run: node scripts/prepare-cloudflared.mjs
      - name: Verify startup and source installer regressions
        run: node --test electron/startup-tray.node-test.mjs scripts/source-installer.node-test.mjs
      - name: Build Windows packages
        run: pnpm package:win
      - name: Install isolated native smoke tools
        shell: pwsh
        run: npm install --prefix "$env:RUNNER_TEMP/smoke-tools" --no-audit --no-fund playwright-core@1.56.1
      - name: Verify installed Windows onboarding and relaunch
        shell: pwsh
        run: node scripts/verify-main-installed.cjs
      - name: Verify release files
        shell: bash
        run: |
          set -euo pipefail
          test -f release/DaniBot-${{ needs.prepare.outputs.version }}-setup.exe
          test -f release/DaniBot-${{ needs.prepare.outputs.version }}-x64.zip
          test -f release/latest.yml
      - name: Create stable download name
        shell: bash
        run: |
          set -euo pipefail
          version=${{ needs.prepare.outputs.version }}
          cp "release/DaniBot-$version-setup.exe" release/DaniBot-setup.exe
          cp "release/DaniBot-$version-x64.zip" release/DaniBot-Windows-Portable.zip
          test -s release/DaniBot-setup.exe
          test -s release/DaniBot-Windows-Portable.zip
      - name: Upload verified packages directly to private release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-staging.mjs upload v${{ needs.prepare.outputs.version }}-validation.${{ needs.prepare.outputs.short }} ${{ needs.prepare.outputs.sha }} windows

  macos:
    if: inputs.retained_source_sha == ''
    permissions:
      contents: write
    name: macOS arm64 + Intel (dmg + zip)
    needs: prepare
    runs-on: macos-latest
    timeout-minutes: 75
    env:
      # No Apple Developer ID is configured yet. electron-builder may apply an
      # ad-hoc signature, but these builds are not Developer ID signed or notarized.
      DANI_VERIFY_FREE_INSTALL: "1"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      # The arm64 runner has 7 GB of memory; keep the ceiling below it.
      OMB_AI_CHECKS: "0"
      NODE_OPTIONS: "--max-old-space-size=5120"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global pnpm@10.33.0 --no-audit --no-fund
      - run: pnpm install --frozen-lockfile
      - name: Stage pinned cloudflared for both Mac architectures
        run: node scripts/prepare-cloudflared.mjs
      - name: Build macOS packages
        run: pnpm package:mac
      - name: Verify release files
        shell: bash
        run: |
          set -euo pipefail
          version=${{ needs.prepare.outputs.version }}
          for arch in arm64 x64; do
            test -f "release/DaniBot-$version-$arch.dmg"
            test -f "release/DaniBot-$version-mac-$arch.zip"
          done
          test -f release/latest-mac.yml
      - name: Create stable download names
        shell: bash
        run: |
          set -euo pipefail
          version=${{ needs.prepare.outputs.version }}
          cp "release/DaniBot-$version-x64.dmg" release/DaniBot-Intel.dmg
          cp "release/DaniBot-$version-arm64.dmg" release/DaniBot-Silicon.dmg
          cp "release/DaniBot-$version-mac-x64.zip" release/DaniBot-Intel-Portable.zip
          cp "release/DaniBot-$version-mac-arm64.zip" release/DaniBot-Silicon-Portable.zip
          for file in \
            DaniBot-Intel.dmg DaniBot-Silicon.dmg \
            DaniBot-Intel-Portable.zip DaniBot-Silicon-Portable.zip; do
            test -s "release/$file"
          done
      - name: Upload verified packages directly to private release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-staging.mjs upload v${{ needs.prepare.outputs.version }}-validation.${{ needs.prepare.outputs.short }} ${{ needs.prepare.outputs.sha }} macos

  checks:
    name: Release regression gate
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMB_AI_CHECKS: '0'
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global pnpm@10.33.0 --no-audit --no-fund
      - run: pnpm install --frozen-lockfile
      - run: node --test scripts/release-pipeline.node-test.mjs scripts/release-asset-names.node-test.mjs
      - run: pnpm exec vitest run server/dani-free-runtime-lifecycle.test.ts server/dani-free-runtime.test.ts server/drivers/dani-free.test.ts server/dani-free-setup.test.ts server/engine-standalone.test.ts server/routes/instances.test.ts server/tested-ai.test.ts

  download_check:
    # GitHub hides draft releases from read-only tokens. Write contents is needed to read this private draft;
    # this job contains no upload, edit, delete or publication command.
    permissions:
      contents: write
    name: Download and install exact staged bytes (${{ matrix.os }}, ${{ matrix.format }})
    if: always() && github.event_name != 'pull_request' && needs.prepare.result == 'success' && (inputs.retained_source_sha != '' || (needs.linux.result == 'success' && needs.windows.result == 'success' && needs.macos.result == 'success'))
    needs: [prepare, linux, windows, macos]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            format: nsis
          - os: windows-latest
            platform: windows
            format: zip
          - os: macos-latest
            platform: macos
            format: dmg
          - os: macos-15-intel
            platform: macos
            format: dmg
          - os: ubuntu-latest
            platform: linux
            format: deb
          - os: ubuntu-latest
            platform: linux
            format: appimage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      OMB_AI_CHECKS: '0'
      DANI_VERIFY_FREE_INSTALL: '1'
      DANI_INSTALLER_FORMAT: ${{ matrix.format }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.verifier_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - run: node scripts/release-download-verify.mjs v${{ needs.prepare.outputs.version }}-validation.${{ needs.prepare.outputs.short }} ${{ needs.prepare.outputs.sha }} ${{ matrix.platform }} ${{ matrix.format }}
      - run: npm install --prefix "${{ runner.temp }}/smoke-tools" --no-audit --no-fund playwright-core@1.56.1
      - if: matrix.platform == 'windows'
        run: node scripts/verify-main-installed.cjs
      - if: matrix.platform == 'macos'
        run: node scripts/verify-main-mac-installed.cjs
      - if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libfuse2t64 xvfb dbus-x11 libnss3 libatk-bridge2.0-0 libgtk-3-0t64 libasound2t64
      - if: matrix.platform == 'linux' && matrix.format == 'appimage'
        run: dbus-run-session -- xvfb-run -a node scripts/verify-main-linux-installed.cjs
      - if: matrix.platform == 'linux' && matrix.format == 'deb'
        run: dbus-run-session -- xvfb-run -a bash scripts/verify-deb-clean-opt.sh

  published_deb_migration:
    name: Published DEB upgrade and preserved-state proof
    if: always() && needs.prepare.result == 'success' && (inputs.retained_source_sha != '' || needs.linux.result == 'success')
    needs: [prepare, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      OMB_AI_CHECKS: '0'
      DANI_INSTALLER_FORMAT: deb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.verifier_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - run: node scripts/release-download-verify.mjs v${{ needs.prepare.outputs.version }}-validation.${{ needs.prepare.outputs.short }} ${{ needs.prepare.outputs.sha }} linux deb
      - run: node scripts/fetch-published-deb-migration.mjs
      - run: npm install --prefix "${{ runner.temp }}/smoke-tools" --no-audit --no-fund playwright-core@1.56.1
      - run: sudo apt-get update && sudo apt-get install -y xvfb dbus-x11 libnss3 libatk-bridge2.0-0 libgtk-3-0t64 libasound2t64
      - run: dbus-run-session -- xvfb-run -a bash scripts/verify-deb-published-migration.sh
