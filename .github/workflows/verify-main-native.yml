name: Verify main native startup
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  startup:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global pnpm@10.33.0 --no-audit --no-fund
      - run: pnpm install --frozen-lockfile
      - run: node --test electron/startup-tray.node-test.mjs scripts/source-installer.node-test.mjs
      - run: node scripts/verify-startup-tray.mjs
