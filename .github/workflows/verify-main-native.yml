name: Verify main native startup
on:
  workflow_dispatch:
    inputs:
      inspect_intel_download:
        description: Observe existing private Intel Safari download and Gatekeeper dialogs, without approving any exception
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  startup:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global pnpm@10.33.0 --no-audit --no-fund
      - run: pnpm install --frozen-lockfile
      - run: node --test electron/startup-tray.node-test.mjs scripts/source-installer.node-test.mjs
      - run: node scripts/verify-startup-tray.mjs
      - name: Native CryptoKit credential interoperability
        if: matrix.os == 'macos-15-intel'
        run: pnpm exec vitest run server/phone-secret.test.ts server/phone-secret-interop.test.ts
  quarantine_observation:
    if: inputs.inspect_intel_download && github.ref == 'refs/heads/fix/mac-quarantine-observation-20261109'
    runs-on: macos-15-intel
    timeout-minutes: 10
    permissions:
      # Draft releases require push visibility, even for this read-only code.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Observe existing Intel Safari download quarantine
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          python3 scripts/inspect-intel-download-quarantine.py > "$RUNNER_TEMP/quarantine-observation.log" 2>&1
          result=$?
          cat "$RUNNER_TEMP/quarantine-observation.log"
          exit "$result"
