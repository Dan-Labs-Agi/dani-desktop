# Manual Windows Defender verification: builds the installer with EXACTLY the
# release lane's Windows toolchain (scripts/ci-workflow.test.ts pins step
# parity), so a Defender submission covers the bytes a release would ship.
name: Windows Defender check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Build the release installer for Defender submission
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      NODE_OPTIONS: "--max-old-space-size=7168"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Stage pinned cloudflared for Windows
        run: node scripts/prepare-cloudflared.mjs
      - name: Build Windows packages
        run: pnpm package:win
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-defender-check
          path: |
            release/DaniBot-*.exe
          if-no-files-found: error
          retention-days: 7
