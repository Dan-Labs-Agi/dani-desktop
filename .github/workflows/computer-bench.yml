name: Computer-use benchmark

# The deterministic fixture pack: scripted agents on a fake desktop, through the real computer service. It measures
# whether the checks change outcomes, never a model, and a run fails when the pack stops saying what it is for.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  pull_request:
    paths:
      - "computeruse/**"
      - "server/computer-evidence*"
      - "server/final-action-consent*"
      - "server/mcp-bridge.ts"
      - "shared/computer-final-action*"
      - ".github/workflows/computer-bench.yml"

permissions:
  contents: read

concurrency:
  group: computer-bench-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fixture-pack:
    name: fixture pack (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # A pull request gets one platform; the nightly run covers all three.
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest","windows-latest","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global pnpm@10.33.0 --no-audit --no-fund
      - run: pnpm install --frozen-lockfile
      - name: Run the fixture pack
        run: pnpm bench:computer
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: computer-bench-${{ matrix.os }}
          path: evals/reports/computer/
          if-no-files-found: warn
          retention-days: 30
