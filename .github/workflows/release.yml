# Native desktop release builds. Each package is built on the OS it runs on,
# then collected into one draft release for human review.
name: Release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit, tag, or branch to release (defaults to the selected branch)"
        required: false
        type: string
  push:
    branches:
      - main
      - prod
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') }}

jobs:
  prepare:
    name: Pin release commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          version=$(node -p "require('./package.json').version")
          release_tag="v$version"

          # Branch pushes release the exact commit that caused the run. Only a
          # tag-triggered run has a tag whose name must match package.json.
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            test "$sha" = "$GITHUB_SHA" || {
              echo "::error::checkout $sha does not match triggering commit $GITHUB_SHA"
              exit 1
            }
          fi
          if [[ "$GITHUB_REF" == refs/tags/* || "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            node scripts/release-version.mjs validate "$version" "$GITHUB_REF"
            tag_sha=$(git rev-parse --verify "$release_tag^{commit}" 2>/dev/null || true)
            release_json=$(gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish 2>/dev/null || true)
            draft_sha=""
            if [[ -n "$release_json" ]]; then
              test "$(jq -r .isDraft <<< "$release_json")" = true || {
                echo "::error::$release_tag is already published; refusing to overwrite it"
                exit 1
              }
              draft_sha=$(jq -r .targetCommitish <<< "$release_json")
            fi
            node scripts/release-version.mjs identity "$sha" "$tag_sha" "$draft_sha"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux x64 (AppImage + deb)
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_OPTIONS: "--max-old-space-size=7168"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global pnpm@10.33.0 --no-audit --no-fund
      - run: pnpm install --frozen-lockfile
      - name: Stage pinned cloudflared for Linux
        run: node scripts/prepare-cloudflared.mjs
      - name: Build Linux packages
        run: pnpm package:linux
      - name: Verify release files
        shell: bash
        run: |
          set -euo pipefail
          test -f release/DaniBot-${{ needs.prepare.outputs.version }}-x86_64.AppImage
          test -f release/DaniBot-${{ needs.prepare.outputs.version }}-amd64.deb
          test -f release/latest-linux.yml
      - name: Create stable download names
        shell: bash
        run: |
          set -euo pipefail
          version=${{ needs.prepare.outputs.version }}
          cp "release/DaniBot-$version-x86_64.AppImage" release/DaniBot.AppImage
          cp "release/DaniBot-$version-amd64.deb" release/danibot-amd64.deb
          test -s release/DaniBot.AppImage
          test -s release/danibot-amd64.deb
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-release
          path: |
            release/DaniBot-*.AppImage
            release/DaniBot.AppImage
            release/DaniBot-*.deb
            release/danibot-amd64.deb
            release/latest-linux.yml
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows x64 (NSIS)
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      NODE_OPTIONS: "--max-old-space-size=7168"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global pnpm@10.33.0 --no-audit --no-fund
      - run: pnpm install --frozen-lockfile
      - name: Stage pinned cloudflared for Windows
        run: node scripts/prepare-cloudflared.mjs
      - name: Verify startup and source installer regressions
        run: node --test electron/startup-tray.node-test.mjs scripts/source-installer.node-test.mjs
      - name: Build Windows packages
        run: pnpm package:win
      - name: Install isolated native smoke tools
        shell: pwsh
        run: npm install --prefix "$env:RUNNER_TEMP/smoke-tools" --no-audit --no-fund playwright-core@1.56.1
      - name: Verify installed Windows onboarding and relaunch
        shell: pwsh
        run: node scripts/verify-main-installed.cjs
      - name: Verify release files
        shell: bash
        run: |
          set -euo pipefail
          test -f release/DaniBot-${{ needs.prepare.outputs.version }}-setup.exe
          test -f release/DaniBot-${{ needs.prepare.outputs.version }}-win-x64.zip
          test -f release/latest.yml
      - name: Create stable download name
        shell: bash
        run: |
          set -euo pipefail
          version=${{ needs.prepare.outputs.version }}
          cp "release/DaniBot-$version-setup.exe" release/DaniBot-setup.exe
          cp "release/DaniBot-$version-win-x64.zip" release/DaniBot-Windows-Portable.zip
          test -s release/DaniBot-setup.exe
          test -s release/DaniBot-Windows-Portable.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-release
          path: |
            release/DaniBot-*.exe
            release/DaniBot-*.exe.blockmap
            release/DaniBot-${{ needs.prepare.outputs.version }}-win-x64.zip
            release/DaniBot-Windows-Portable.zip
            release/latest.yml
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macOS arm64 + Intel (dmg + zip)
    needs: prepare
    runs-on: macos-latest
    timeout-minutes: 75
    outputs:
      signed: ${{ steps.signed.outputs.signed }}
    env:
      # Squirrel.Mac validates updates against the installed app's signing identity.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      # The arm64 runner has 7 GB of memory; keep the ceiling below it.
      NODE_OPTIONS: "--max-old-space-size=5120"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global pnpm@10.33.0 --no-audit --no-fund
      - run: pnpm install --frozen-lockfile
      - name: Stage pinned cloudflared for both Mac architectures
        run: node scripts/prepare-cloudflared.mjs
      - name: Build unsigned macOS draft packages
        if: vars.DANI_MAC_SIGNING != 'true' || (github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/v'))
        run: pnpm package:mac
      - name: Build and verify Developer ID signed, notarized macOS packages
        id: signed
        if: vars.DANI_MAC_SIGNING == 'true' && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v'))
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "true"
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          for credential in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            test -n "${!credential}" || { echo "::error::DANI_MAC_SIGNING requires $credential"; exit 1; }
          done
          pnpm package:mac -c.forceCodeSigning=true -c.mac.notarize=true
          for arch in arm64 x64; do
            extracted=$(mktemp -d "$RUNNER_TEMP/dani-signed-$arch.XXXXXX")
            ditto -xk "release/DaniBot-$VERSION-$arch.zip" "$extracted"
            app="$extracted/Dani Bot.app"
            codesign --verify --deep --strict "$app"
            identity=$(codesign -dv --verbose=4 "$app" 2>&1)
            printf '%s\n' "$identity" | grep -F 'Authority=Developer ID Application:'
            printf '%s\n' "$identity" | grep -Fx "TeamIdentifier=$APPLE_TEAM_ID"
            expected=arm64
            if [[ "$arch" == x64 ]]; then expected=x86_64; fi
            lipo -archs "$app/Contents/MacOS/Dani Bot" | grep -Fx "$expected"
            xcrun stapler validate "$app"
            spctl --assess --type execute --verbose=4 "$app"
            dmg="release/DaniBot-$VERSION-$arch.dmg"
            xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" \
              --wait --output-format json | jq -e '.status == "Accepted"'
            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
            node scripts/regenerate-blockmaps.mjs "$dmg"
          done
          node scripts/regenerate-mac-feed.mjs
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - name: Verify release files
        shell: bash
        run: |
          set -euo pipefail
          version=${{ needs.prepare.outputs.version }}
          for arch in arm64 x64; do
            test -f "release/DaniBot-$version-$arch.dmg"
            test -f "release/DaniBot-$version-$arch.zip"
          done
          test -f release/latest-mac.yml
      - name: Create stable download names
        shell: bash
        run: |
          set -euo pipefail
          version=${{ needs.prepare.outputs.version }}
          cp "release/DaniBot-$version-x64.dmg" release/DaniBot-Intel.dmg
          cp "release/DaniBot-$version-arm64.dmg" release/DaniBot-Silicon.dmg
          cp "release/DaniBot-$version-x64.zip" release/DaniBot-Intel-Portable.zip
          cp "release/DaniBot-$version-arm64.zip" release/DaniBot-Silicon-Portable.zip
          for file in \
            DaniBot-Intel.dmg DaniBot-Silicon.dmg \
            DaniBot-Intel-Portable.zip DaniBot-Silicon-Portable.zip; do
            test -s "release/$file"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-release
          path: |
            release/DaniBot-*.dmg
            release/DaniBot-*.dmg.blockmap
            release/DaniBot-${{ needs.prepare.outputs.version }}-arm64.zip
            release/DaniBot-${{ needs.prepare.outputs.version }}-x64.zip
            release/DaniBot-Intel-Portable.zip
            release/DaniBot-Silicon-Portable.zip
            release/DaniBot-*.zip.blockmap
            release/latest-mac.yml
          if-no-files-found: error
          retention-days: 7

  candidate-ci:
    name: Verify pinned release candidate CI
    needs: prepare
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: release-ci-${{ needs.prepare.outputs.version }}
      cancel-in-progress: false
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Require complete native-platform CI for this candidate
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.prepare.outputs.sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: node scripts/release-ci.mjs

  release:
    name: Create draft release
    needs: [prepare, candidate-ci, linux, windows, macos]
    # Release hold: an ordinary branch push only validates the packaging above.
    # Tags and draft releases are created only by a v* tag push or an explicit
    # manual dispatch, after the required checks have passed.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: release-draft-${{ needs.prepare.outputs.version }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global pnpm@10.33.0 --no-audit --no-fund
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          pattern: "*-release"
          merge-multiple: false
      - name: Verify complete artifact set
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Downloaded release asset inventory:"
          find release-assets -maxdepth 2 -type f -printf '%P\n' | sort
          node scripts/release-artifacts.mjs release-assets "$VERSION"
          required=(
            DaniBot.AppImage
            danibot-amd64.deb
            DaniBot-setup.exe
            DaniBot-Windows-Portable.zip
            DaniBot-Intel.dmg
            DaniBot-Intel-Portable.zip
            DaniBot-Silicon.dmg
            DaniBot-Silicon-Portable.zip
            latest-linux.yml latest.yml latest-mac.yml
          )
          for file in "${required[@]}"; do
            test -s "$(find release-assets -type f -name "$file")" || {
              echo "::error::missing release asset: $file"
              exit 1
            }
          done
      - name: Create or refresh draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SHA: ${{ needs.prepare.outputs.sha }}
          MAC_SIGNED: ${{ needs.macos.outputs.signed }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$VERSION"
          mac_trust="macOS is not Developer ID signed or notarized; Gatekeeper may block it. This is an untrusted review draft, not a Mac automatic-update bootstrap."
          if [[ "$MAC_SIGNED" == true ]]; then
            mac_trust="macOS ZIP apps passed Developer ID signature, team, architecture, stapled ticket and Gatekeeper checks; DMGs passed notarization and stapling. Native installed-app and automatic-upgrade verification are still required."
          fi
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          ## Downloads

          | Operating system | Variant | Download |
          | --- | --- | --- |
          | Windows x64 | Installer | [DaniBot-setup.exe](https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/DaniBot-setup.exe) |
          | Windows x64 | Portable zip | [DaniBot-Windows-Portable.zip](https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/DaniBot-Windows-Portable.zip) |
          | macOS Intel | DMG | [DaniBot-Intel.dmg](https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/DaniBot-Intel.dmg) |
          | macOS Intel | Portable zip | [DaniBot-Intel-Portable.zip](https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/DaniBot-Intel-Portable.zip) |
          | macOS Apple silicon | DMG | [DaniBot-Silicon.dmg](https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/DaniBot-Silicon.dmg) |
          | macOS Apple silicon | Portable zip | [DaniBot-Silicon-Portable.zip](https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/DaniBot-Silicon-Portable.zip) |
          | Linux x64 | AppImage | [DaniBot.AppImage](https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/DaniBot.AppImage) |
          | Linux x64 | Debian package | [danibot-amd64.deb](https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/danibot-amd64.deb) |

          ## Notes

          - Built from pinned commit \`$SHA\`; full native-platform CI was required for this commit, an identical source tree, or its version-only parent.
          - Windows builds are unsigned and may show a SmartScreen warning.
          - $mac_trust
          - Windows passed an isolated NSIS install, onboarding, and relaunch check on a native Windows runner.
          - These exact macOS and Linux release installers have not passed clean-machine install and upgrade checks in this workflow. Test both Mac architectures and Linux packages before publishing this draft.
          - Do not publish until signing trust and native install/upgrade checks pass. Existing ad-hoc Mac installations may need a one-time signed installer bootstrap.

          Blockmap files and \`latest.yml\`, \`latest-mac.yml\`, and \`latest-linux.yml\` are auto-update metadata, not manual downloads.
          EOF
          # Creating a ref is atomic: never let an existing version tag move to
          # a different commit, including when another actor creates it mid-run.
          if ! gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/$tag" -f "sha=$SHA"; then
            echo "Version tag already exists or could not be created; verifying its commit."
          fi
          tag_refs=$(git ls-remote --tags origin "refs/tags/$tag" "refs/tags/$tag^{}")
          test -n "$tag_refs" || { echo "::error::release tag does not exist"; exit 1; }
          tag_sha=$(printf '%s\n' "$tag_refs" | tail -n 1 | cut -f1)
          node scripts/release-version.mjs identity "$SHA" "$tag_sha"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            is_draft=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
            existing_sha=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish)
            node scripts/release-version.mjs identity "$SHA" "$tag_sha" "$existing_sha"
            test "$is_draft" = true || {
              echo "::error::$tag is already published; refusing to overwrite it"
              exit 1
            }
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" \
              --target "$SHA" --title "Dani Bot $VERSION" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --target "$SHA" --draft --title "Dani Bot $VERSION" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          # Upload one unique basename at a time. A single wildcard request can
          # fail after partially succeeding, which makes a rerun ambiguous.
          # Per-file clobber plus bounded retries makes this step idempotent.
          declare -A uploaded=()
          find release-assets -type f -print0 \
            | sort -z \
            | while IFS= read -r -d '' asset; do
                name=$(basename "$asset")
                if [[ -n "${uploaded[$name]:-}" ]]; then
                  echo "::error::duplicate release asset basename: $name"
                  exit 1
                fi
                uploaded[$name]=1
                for attempt in 1 2 3; do
                  state=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish)
                  test "$(jq -r .isDraft <<< "$state")" = true || {
                    echo "::error::$tag is no longer a draft; refusing to overwrite it"
                    exit 1
                  }
                  node scripts/release-version.mjs identity "$SHA" "" "$(jq -r .targetCommitish <<< "$state")"
                  if gh release upload "$tag" "$asset" \
                    --repo "$GITHUB_REPOSITORY" --clobber; then
                    break
                  fi
                  if [[ "$attempt" == 3 ]]; then
                    echo "::error::failed to upload $name after $attempt attempts"
                    exit 1
                  fi
                  echo "retrying $name after upload attempt $attempt"
                  sleep $((attempt * 5))
                done
              done
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft | grep -qx true
