# Separate branch only: native Intel Mac test, no Actions artifact/cache writes.
name: Maintenance Intel Mac verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15-intel
    timeout-minutes: 75
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      DANIBOT_CUA_ARCHES: x64
      DANIBOT_CUA_ARCHES_PARTIAL: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global pnpm@10.33.0 --no-audit --no-fund
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run server/managed-runtime-retry.test.ts server/managed-runtime.test.ts server/drivers/acp/hermes.test.ts
      - run: pnpm package:prepare
      - run: pnpm build:speech && pnpm build:recorder && pnpm build:cua
      - run: pnpm exec electron-builder --mac --x64 --publish never -c.mac.identity=-
      - run: npm install --prefix "$RUNNER_TEMP/smoke-tools" --no-audit --no-fund playwright-core@1.56.1
      - run: node scripts/verify-intel-mac-installer.cjs
