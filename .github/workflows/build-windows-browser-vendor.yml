name: Build Windows browser vendor

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - run: |
          corepack enable
          corepack prepare pnpm@11.1.3 --activate
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          rustup target add x86_64-pc-windows-gnu
          sudo apt-get update
          sudo apt-get install --yes gcc-mingw-w64-x86-64
          pnpm install --frozen-lockfile
      - run: node scripts/build-windows-browser-vendor.mjs --output "$RUNNER_TEMP/windows-browser-vendor"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-browser-vendor
          path: ${{ runner.temp }}/windows-browser-vendor
